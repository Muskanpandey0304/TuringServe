[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turingserve"
version = "0.1.0"
description = "LLM inference server for NVIDIA Turing GPUs"
requires-python = ">=3.10,<3.15"
license = {text = "Apache-2.0"}
dependencies = []        # everything is pinned in requirements.lock; torch is installed separately

[project.scripts]
turingserve = "turingserve.cli:main"

[tool.setuptools.packages.find]
include = ["turingserve*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"turingserve/ops/*.py" = ["E741"]          # l, m, I: standard FlashAttention-paper notation
"turingserve/model/qwen2.py" = ["E741"]     # l: layer index, matches kv_cache[l, ...] throughout
"turingserve/metrics/prometheus.py" = ["E741"]  # l: label name in a tight comprehension
"tests/kernels/test_kernels.py" = ["E741"]  # I: intermediate/GLU dim, matches the kernel it tests
"turingserve/autopilot/tuner.py" = ["B023"]  # lambdas are invoked synchronously within the same loop iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
asyncio_mode = "auto"
markers = [
  "gpu: needs a CUDA GPU",
  "model: needs a downloaded real model (TS_MODEL_05 / TS_MODEL_15)",
  "slow: takes more than 30 seconds",
  "kaggle: needs the T4 or the 1.5B model",
]
